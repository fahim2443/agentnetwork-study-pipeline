<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentNetwork Study Pipeline</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-color: #00aaff;
            --secondary-color: #2c2c2c;
            --border-color: #444;
            --success-color: #28a745;
            --error-color: #dc3545;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 2rem;
        }
        .input-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        #topic-input {
            flex-grow: 1;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }
        #topic-input:focus {
            border-color: var(--primary-color);
        }
        #generate-btn {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #generate-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #generate-btn:not(:disabled):hover {
            background-color: #0088cc;
        }
        .output-section {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 0;
        }
        #knowledge-output {
            line-height: 1.6;
        }
        .quiz-question {
            margin-bottom: 1.5rem;
        }
        .quiz-question p {
            margin: 0 0 0.8rem 0;
            font-weight: bold;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .quiz-option {
            display: block;
            background-color: #333;
            padding: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }
        .quiz-option:hover {
            background-color: #444;
        }
        .quiz-option.selected {
            border-color: var(--primary-color);
        }
        .quiz-option.correct {
            background-color: var(--success-color);
            color: #fff;
        }
        .quiz-option.incorrect {
            background-color: var(--error-color);
            color: #fff;
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #222;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }
        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }
        .status-light.red { background-color: var(--error-color); }
        .status-light.green { background-color: var(--success-color); }
        .status-light.orange { background-color: #ff9800; }
        .loader {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        .dot-flashing {
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: var(--primary-color);
            animation: dotFlashing 1s infinite linear alternate;
            animation-delay: .5s;
            display: inline-block;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: var(--primary-color);
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: var(--primary-color);
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dotFlashing {
            0% { background-color: var(--primary-color); }
            50%, 100% { background-color: rgba(0, 170, 255, 0.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AgentNetwork Study Pipeline</h1>
        <p class="subtitle">Enter a Computer Science topic to get an explanation and a quiz.</p>
        
        <div class="input-container">
            <input type="text" id="topic-input" placeholder="e.g., Recursion, Binary Search, Stacks...">
            <button id="generate-btn">Generate</button>
        </div>

        <div class="loader" id="loader">
            <p>Agents are thinking...</p>
            <div class="dot-flashing"></div>
        </div>

        <div id="output-container" style="display: none;">
            <div class="output-section">
                <h2 id="knowledge-title"></h2>
                <div id="knowledge-output"></div>
            </div>
            <div class="output-section">
                <h2>Quiz</h2>
                <div id="quiz-output"></div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div id="daemon-status">
            <span class="status-light red"></span>
            <span>Daemon: Disconnected</span>
        </div>
        <div id="services-status">
            <span></span>
        </div>
    </div>

    <script>
        const topicInput = document.getElementById('topic-input');
        const generateBtn = document.getElementById('generate-btn');
        const outputContainer = document.getElementById('output-container');
        const knowledgeTitle = document.getElementById('knowledge-title');
        const knowledgeOutput = document.getElementById('knowledge-output');
        const quizOutput = document.getElementById('quiz-output');
        const loader = document.getElementById('loader');
        const daemonStatus = document.getElementById('daemon-status');
        const servicesStatus = document.getElementById('services-status');

        const ORCHESTRATOR_URL = 'http://localhost:7103';

        async function checkDaemonStatus() {
            try {
                const response = await fetch(`${ORCHESTRATOR_URL}/health`);
                if (response.ok) {
                    daemonStatus.innerHTML = '<span class="status-light green"></span><span>Daemon: Connected</span>';
                    // Since the service count from `anet svc list` can be unreliable during startup,
                    // we'll show a static message once the orchestrator is reachable.
                    servicesStatus.innerHTML = '<span>3 Agents Active</span>';
                } else {
                    throw new Error('Daemon not healthy');
                }
            } catch (error) {
                daemonStatus.innerHTML = '<span class="status-light red"></span><span>Daemon: Disconnected</span>';
                servicesStatus.innerHTML = '';
            }
        }

        generateBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            if (!topic) {
                alert('Please enter a topic.');
                return;
            }

            generateBtn.disabled = true;
            loader.style.display = 'block';
            outputContainer.style.display = 'none';

            try {
                const response = await fetch(`${ORCHESTRATOR_URL}/study`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'An unknown error occurred.');
                }

                const data = await response.json();
                renderOutput(data);

            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        function renderOutput(data) {
            knowledgeTitle.textContent = `Knowledge: ${data.topic}`;
            knowledgeOutput.textContent = data.knowledge;
            
            quizOutput.innerHTML = '';
            data.quiz.forEach((q, index) => {
                const questionEl = document.createElement('div');
                questionEl.className = 'quiz-question';
                questionEl.innerHTML = `<p>${index + 1}. ${q.question}</p>`;
                
                const optionsEl = document.createElement('div');
                optionsEl.className = 'quiz-options';

                // Deduplicate options before rendering
                const uniqueOptions = [...new Set(q.options)];
                
                // If not enough unique options, skip question or handle appropriately
                if (uniqueOptions.length < 2) return;

                // Pad if less than 4
                while (uniqueOptions.length < 4) {
                    uniqueOptions.push("None of the above");
                }

                uniqueOptions.forEach(optionText => {
                    const optionEl = document.createElement('label');
                    optionEl.className = 'quiz-option';
                    optionEl.textContent = optionText;
                    optionEl.addEventListener('click', () => {
                        // Remove selection from siblings
                        Array.from(optionsEl.children).forEach(child => child.classList.remove('selected'));
                        optionEl.classList.add('selected');
                        
                        // Check answer
                        const selectedAnswerLetter = optionText.trim().charAt(0);
                        if (selectedAnswerLetter === q.answer) {
                            optionEl.classList.add('correct');
                        } else {
                            optionEl.classList.add('incorrect');
                            // Highlight the correct one
                            const correctOption = Array.from(optionsEl.children).find(child => child.textContent.trim().startsWith(q.answer));
                            if (correctOption) {
                                correctOption.classList.add('correct');
                            }
                        }
                        // Disable further clicks
                        Array.from(optionsEl.children).forEach(child => child.style.pointerEvents = 'none');
                    });
                    optionsEl.appendChild(optionEl);
                });

                questionEl.appendChild(optionsEl);
                quizOutput.appendChild(questionEl);
            });

            outputContainer.style.display = 'block';
        }

        // Initial and periodic checks
        checkDaemonStatus();
        setInterval(checkDaemonStatus, 5000);
    </script>
</body>
</html>
